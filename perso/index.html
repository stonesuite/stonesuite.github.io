<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <title>STONE</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/stone-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/stone-192.png">
  <style>
    /* STONE — coque PWA unifiée · design "Quiet Capital" */
    :root{
      --bg:#08090c;--panel:#101218;--panel2:#161922;--line:#22262f;
      --text:#eef0f4;--muted:#888d9a;--gold:#c9a567;--gold-dim:rgba(201,165,103,.14);
      --green:#3ecf8e;--red:#ff6b6b;
      --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overscroll-behavior:none}
    .shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
    .shell-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px calc(10px);border-bottom:1px solid var(--line);background:var(--panel)}
    .brand{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;color:inherit;text-align:left;font:inherit;cursor:pointer}
    /* L'accueil peut dépasser la hauteur d'un petit écran (pyramide + trois
       univers + guides) : il défile au lieu de passer sous la barre d'onglets. */
    .home-panel{padding-block:18px}
    .home-panel .pyr{margin:12px auto 0;display:block;max-width:min(280px,64vh);width:100%}
    /* Cinematique : la pyramide s'assemble, base d'abord, la pointe couronne.
       Chaque tranche part de sa position d'arrivee (pas de fill-mode qui pourrait
       la laisser invisible si l'animation ne demarre jamais : voir AGENTS.md). */
    @keyframes stone-rise{from{opacity:0;transform:translateY(46px) scaleY(.62)}55%{opacity:1}72%{transform:translateY(-3px) scaleY(1.02)}}
    @keyframes stone-crown{from{opacity:0;transform:translateY(-70px) rotate(-7deg)}62%{opacity:1}78%{transform:translateY(4px) rotate(.5deg)}}
    /* Les libelles se resserrent en apparaissant : detail de gravure. */
    @keyframes stone-label{from{opacity:0;letter-spacing:.7em}60%{opacity:1}}
    @keyframes stone-detail{from{opacity:0}}
    /* Le reflet est decoupe sur la silhouette : de la lumiere sur la pierre,
       pas une bande posee sur la boite. */
    @keyframes stone-sheen{0%{opacity:0;transform:translateX(-70px)}18%{opacity:1}82%{opacity:1}100%{opacity:0;transform:translateX(330px)}}
    @keyframes stone-glow{from{opacity:0;transform:scale(.72)}70%{opacity:1}to{opacity:.85;transform:scale(1)}}
    @keyframes stone-plinth{from{opacity:0;transform:scaleX(.15)}to{opacity:1;transform:scaleX(1)}}
    @keyframes stone-gem{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
    @keyframes stone-row{from{opacity:0;transform:translateY(16px) scale(.985)}}
    .home-panel .pyr [data-go]{transform-box:fill-box;transform-origin:50% 100%}
    .home-panel .pyr .s-money{animation:stone-rise .72s cubic-bezier(.22,1,.36,1) .05s}
    .home-panel .pyr .s-invest{animation:stone-rise .72s cubic-bezier(.22,1,.36,1) .34s}
    .home-panel .pyr .s-estate{animation:stone-crown .78s cubic-bezier(.3,1.35,.5,1) .62s}
    .home-panel .pyr text{animation:stone-label .62s cubic-bezier(.2,.7,.3,1) 1s}
    .home-panel .pyr .detail{animation:stone-detail .5s ease 1.05s}
    .home-panel .pyr .pyr-glow{transform-box:view-box;transform-origin:50% 62%;opacity:.85;animation:stone-glow 1.5s ease-out}
    .home-panel .pyr .pyr-plinth{transform-box:view-box;transform-origin:50% 50%;animation:stone-plinth .7s cubic-bezier(.22,1,.36,1) .95s}
    .home-panel .pyr .pyr-sheen{transform-box:view-box;opacity:0;animation:stone-sheen 1.25s ease-in-out 1.2s}
    .home-panel .mark{animation:stone-gem .9s ease 1.5s}
    .pyr-wrap{position:relative;max-width:280px;margin:0 auto}
    .home-rows{display:grid;gap:8px;max-width:340px;margin:18px auto 0;width:100%}
    .home-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
      min-height:56px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;
      background:var(--panel2);color:var(--text);font:inherit;text-align:left;cursor:pointer;
      animation:stone-row .5s ease both}
    .home-row:nth-child(1){animation-delay:1.5s}
    .home-row:nth-child(2){animation-delay:1.63s}
    .home-row:nth-child(3){animation-delay:1.76s}
    .home-row:hover,.home-row:focus-visible{border-color:var(--u-accent,var(--gold));outline:none;transform:translateX(2px)}
    .home-row .r-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;
      background:var(--panel);color:var(--u-accent,var(--gold))}
    .home-row .r-copy{min-width:0}
    .home-row .r-name{display:block;font-size:13px;font-weight:800;letter-spacing:.02em}
    .home-row .r-sub{display:block;color:var(--muted);font-size:11px;line-height:1.4}
    /* Inventaire : le montant n'apparait que lorsqu'un univers a repondu. La
       quatrieme colonne n'existe que dans ce cas — une rangee sans chiffre
       reste strictement identique a ce qu'elle etait. */
    .home-row.has-value{grid-template-columns:auto 1fr auto auto}
    .home-row .r-value{display:none}
    .home-row.has-value .r-value{display:block;text-align:right;font-size:12.5px;
      font-weight:800;letter-spacing:.01em;color:var(--text);white-space:nowrap;
      font-variant-numeric:tabular-nums}
    .home-row.has-value .r-value .rv-note{display:block;font-size:10px;font-weight:600;
      color:var(--muted);letter-spacing:.02em}
    /* Une valorisation incomplete ne doit pas se distinguer par la seule
       couleur : elle porte un signe. */
    .home-row .r-value .rv-partial::before{content:"\2248 ";font-weight:800}
    .home-row .r-value.is-empty{color:var(--muted);font-weight:600}
    .home-row .r-go{color:var(--muted);font-size:15px}
    .home-guides{margin-top:18px}
    .home-guides a{display:inline-block;padding:9px 16px;border:1px solid var(--line);border-radius:999px;
      background:var(--panel2);color:var(--text);font-size:11.5px;font-weight:700;text-decoration:none;
      animation:stone-row .5s ease both;animation-delay:1.89s}
    .home-guides a:hover,.home-guides a:focus-visible{border-color:var(--gold);color:var(--gold);outline:none}
    .home-trust{margin-top:14px;color:var(--muted);font-size:10.5px;letter-spacing:.02em}
    /* Visite guidée : un halo découpé autour de l'élément expliqué, une bulle
       à côté, et deux commandes. Le halo est un simple bloc à l'ombre immense :
       aucune capture d'événement, aucune copie du DOM. */
    .tour-spot{position:fixed;z-index:60;border-radius:16px;border:2px solid var(--gold);
      box-shadow:0 0 0 9999px rgba(4,6,11,.74),0 0 26px rgba(201,165,103,.35);
      pointer-events:none;transition:top .28s ease,left .28s ease,width .28s ease,height .28s ease}
    .tour-card{position:fixed;z-index:61;max-width:min(330px,calc(100vw - 28px));
      border:1px solid var(--line);border-radius:16px;background:var(--panel);
      padding:16px 18px 14px;box-shadow:0 22px 50px rgba(0,0,0,.55);
      transition:top .28s ease,left .28s ease}
    .tour-card .step{font-family:'Sora';font-size:10px;font-weight:800;letter-spacing:.22em;
      text-transform:uppercase;color:var(--gold)}
    .tour-card h2{margin:8px 0 0;font-size:16px;letter-spacing:-.01em}
    .tour-card p{margin:7px 0 0;color:var(--muted);font-size:12.5px;line-height:1.55}
    .tour-actions{display:flex;align-items:center;gap:10px;margin-top:14px}
    .tour-dots{display:flex;gap:5px;flex:1}
    .tour-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
    .tour-dots i.on{background:var(--gold)}
    .tour-skip{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11.5px;
      font-weight:700;cursor:pointer;padding:8px 4px;min-height:38px}
    .tour-skip:hover{color:var(--text)}
    .tour-next{border:1px solid var(--gold);border-radius:10px;background:var(--gold);
      color:#171109;font:inherit;font-size:12px;font-weight:800;padding:9px 16px;min-height:38px;cursor:pointer}
    .tour-replay{width:100%;min-height:44px;margin-top:4px;border:1px solid var(--line);
      border-radius:10px;background:var(--panel2);color:var(--text);font:inherit;font-size:12px;
      font-weight:700;cursor:pointer}
    .tour-replay:hover{border-color:var(--gold)}
    .privacy-link{display:block;width:100%;min-height:44px;margin-top:8px;padding:11px 0;
      border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;
      font-weight:700;text-align:center;text-decoration:none}
    .privacy-link:hover,.privacy-link:focus-visible{color:var(--gold)}
    @media(prefers-reduced-motion:reduce){.tour-spot,.tour-card{transition:none}}
    @media(prefers-reduced-motion:reduce){
      .home-panel .pyr [data-go],.home-panel .pyr text,.home-panel .pyr .detail,
      .home-panel .pyr .pyr-glow,.home-panel .pyr .pyr-plinth,
      .home-panel .mark,.home-row,.home-guides a{animation:none}
      .home-panel .pyr .pyr-sheen{display:none}
    }
    .home-panel .pyr [data-go]{cursor:pointer;transition:transform .18s ease,filter .18s ease}
    .home-panel .pyr [data-go]:hover,.home-panel .pyr [data-go]:focus-visible{transform:translateY(-3px);filter:brightness(1.08);outline:none}
    .home-panel .pyr text{font-family:inherit;font-weight:800;letter-spacing:.14em;fill:#141008;pointer-events:none}
    .home-panel .pyr .detail{stroke:rgba(18,13,4,.5);stroke-width:1.4;fill:none;stroke-linecap:round;pointer-events:none}
    .home-panel .home-hint{margin-top:14px}
    /* Etage ferme : discret, jamais eteint — la porte mene a son apercu. */
    .home-row.is-soon .r-mark,.home-row.is-soon .r-name{opacity:.72}
    .home-panel .pyr [data-go].is-soon{opacity:.5}
    /* Ecran « Bientot » : une promesse et son apercu. Il doit se lire comme une
       vitrine, jamais comme une panne — d'ou l'absence totale de rouge, de
       pictogramme d'alerte et de bouton de secours. */
    .stage-panel .soon{max-width:420px;padding-bottom:26px}
    .soon .soon-lead{margin:6px auto 0;max-width:34ch;color:var(--text);font-size:15px;line-height:1.5}
    .soon-shot{position:relative;margin:18px auto 0;width:min(206px,56vw);border-radius:18px;
      overflow:hidden;border:1px solid var(--line);background:var(--surface);
      box-shadow:0 20px 44px rgba(0,0,0,.34)}
    .soon-shot img{display:block;width:100%;height:auto;max-height:min(288px,34vh);
      object-fit:cover;object-position:top;opacity:.94}
    /* Le degrade suggere que l'ecran continue : un apercu, pas une image
       coupee net. */
    .soon-fade{position:absolute;left:0;right:0;bottom:0;height:38%;pointer-events:none;
      background:linear-gradient(to bottom,transparent,var(--bg) 92%)}
    .soon-points{list-style:none;margin:18px auto 0;padding:0;max-width:32ch;text-align:left;
      display:grid;gap:9px}
    .soon-points li{position:relative;padding-left:18px;color:var(--muted);font-size:12.5px;line-height:1.5}
    .soon-points li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;
      border-radius:50%;background:var(--u-accent,var(--gold))}
    .soon-guide{margin-top:20px;display:inline-flex;align-items:center;justify-content:center;
      text-decoration:none}
    @media(max-width:420px){.soon-shot{width:min(208px,58vw)}}
    /* Apparition douce de la pyramide juste après la coque (aucun saut de mise
       en page : le panneau est en position absolue au-dessus de la scène).
       Animation CSS pure et JAMAIS d'état invisible par défaut : une bascule
       pilotée en JS (requestAnimationFrame) laisserait l'accueil à opacity:0
       si l'onglet démarre en arrière-plan (rAF ne s'y déclenche pas). */
    /* fill-mode volontairement absent : hors animation l'accueil est opaque,
       donc jamais bloqué à 0 (onglet démarré caché, animation suspendue). */
    .home-panel.is-visible{animation:home-in .34s ease}
    @keyframes home-in{from{opacity:0}to{opacity:1}}
    .brand-mark{color:var(--gold);font-size:20px;display:inline-flex}
    .brand-copy strong{display:block;font-size:14px;letter-spacing:.14em}
    .brand-copy small{display:block;color:var(--muted);font-size:10px}
    .shell-actions{display:flex;align-items:center;gap:8px}
    .connection-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-size:10px;white-space:nowrap}
    .connection-pill span{width:7px;height:7px;border-radius:50%;background:var(--red)}
    .connection-pill.is-online span{background:var(--green)}
    .quiet-button{border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--panel2);color:var(--text);font-size:11px;font-weight:700;cursor:pointer}
    .quiet-button:hover{border-color:var(--gold)}
    .notice{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--gold-dim);font-size:12px}
    .notice button{border:1px solid var(--gold);border-radius:8px;padding:5px 10px;background:transparent;color:var(--gold);font-size:11px;font-weight:700;cursor:pointer}
    .universe-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
    .universe-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;border:1px solid transparent;border-radius:12px;padding:6px 4px;background:transparent;color:var(--muted);font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer}
    .universe-nav button .glyph{font-size:16px;line-height:1.2}
    .universe-nav button.active{border-color:var(--line);background:var(--panel2);color:var(--text)}
    .universe-nav button.active .glyph{color:var(--u-accent,var(--gold))}
    .universe-nav button:disabled{opacity:.45;cursor:default}
    .stage{position:relative;flex:1;min-height:0;background:var(--bg)}
    .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .18s}
    .stage iframe.is-visible{opacity:1;pointer-events:auto}
    .stage-panel{position:absolute;inset:0;display:none;place-items:center;padding:24px;text-align:center;background:var(--bg);overflow-y:auto;align-content:safe center}
    .stage-panel.is-visible{display:grid}
    .stage-panel .mark{font-size:40px;color:var(--u-accent,var(--gold))}
    .stage-panel .eyebrow{margin:12px 0 0;color:var(--u-accent,var(--gold));font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    .stage-panel h1{margin:8px 0 0;font-size:20px;letter-spacing:-.02em}
    .stage-panel p{max-width:420px;margin:10px auto 0;color:var(--muted);font-size:12px;line-height:1.6}
    .stage-panel .warn-hint{margin-top:14px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;
      background:var(--panel2);text-align:left}
    .stage-panel .warn-hint b{color:var(--text)}
    .loading-line{width:180px;height:2px;margin:20px auto 0;border-radius:2px;background:var(--line);overflow:hidden}
    .loading-line span{display:block;width:40%;height:100%;background:var(--u-accent,var(--gold));animation:slide 1.4s ease-in-out infinite}
    @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
    .primary-button{margin-top:18px;border:1px solid var(--gold);border-radius:10px;padding:9px 18px;background:var(--gold);color:#171109;font-size:12px;font-weight:800;cursor:pointer}
    .settings-sheet{position:fixed;inset:auto 0 0 0;z-index:40;max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:var(--panel);box-shadow:0 -20px 60px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .22s}
    .settings-sheet.is-open{transform:none}
    .settings-sheet h2{margin:0 0 4px;font-size:16px}
    .settings-sheet .sheet-sub{margin:0 0 14px;color:var(--muted);font-size:11px;line-height:1.5}
    .settings-field{margin-bottom:12px}
    .settings-field label{display:block;margin-bottom:6px;color:var(--muted);font-size:11px;font-weight:700}
    .settings-field input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--panel2);color:var(--text);font-size:12px}
    .settings-actions{display:flex;gap:8px;margin-top:16px}
    .settings-actions button{flex:1;min-height:46px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer}
    .settings-save{border:1px solid var(--gold);background:var(--gold);color:#171109}
    .settings-cancel{border:1px solid var(--line);background:var(--panel2);color:var(--text)}
    .sheet-backdrop{position:fixed;inset:0;z-index:39;background:rgba(4,5,8,.6);opacity:0;pointer-events:none;transition:opacity .2s}
    .sheet-backdrop.is-open{opacity:1;pointer-events:auto}
    @media(min-width:760px){.settings-sheet{inset:auto 0 0 auto;right:16px;bottom:16px;width:420px;border-radius:18px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<main class="shell">
  <header class="shell-bar">
    <button class="brand" id="brandHomeButton" type="button" aria-label="Accueil STONE">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path d="M12 2 L14.55 7.39 H9.45 Z" fill="currentColor"/><path d="M9.12 8.09 H14.89 L18.12 14.91 H5.88 Z" fill="currentColor"/><path d="M5.55 15.61 H18.45 L21 21 H3 Z" fill="currentColor"/></svg></span>
      <span class="brand-copy"><strong>STONE</strong><small id="universeTagline">La suite STONE</small></span>
    </button>
    <div class="shell-actions">
      <span class="connection-pill" id="connectionPill"><span aria-hidden="true"></span><b id="connectionLabel" style="font-weight:600">…</b></span>
      <button class="quiet-button" id="installButton" type="button" hidden>Installer STONE</button>
      <button class="quiet-button" id="settingsButton" type="button" aria-label="Réglages des univers">⚙</button>
    </div>
  </header>

  <section class="notice" id="inAppNotice" role="status" aria-live="polite" hidden>
    <span id="inAppNoticeText"></span>
  </section>
  <section class="notice" id="updateNotice" role="status" aria-live="polite" hidden>
    <span>Une nouvelle version de STONE est disponible.</span>
    <button type="button" id="updateButton">Mettre à jour</button>
  </section>
  <section class="notice" id="appleNotice" role="dialog" aria-label="Installer sur iPhone ou iPad" hidden>
    <span><strong>Sur iPhone/iPad :</strong> Partager → Ajouter à l’écran d’accueil.</span>
    <button type="button" id="appleNoticeClose" aria-label="Fermer">×</button>
  </section>

  <section class="stage" id="stage" aria-live="polite"></section>

  <nav class="universe-nav" id="universeNav" aria-label="Univers STONE"></nav>
</main>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<section class="settings-sheet" id="settingsSheet" role="dialog" aria-label="Réglages des univers" aria-modal="true">
  <h2>Réglages des univers</h2>
  <p class="sheet-sub">Ces adresses restent uniquement sur cet appareil, jamais publiées. Laisse vide pour garder la valeur par défaut.</p>
  <div id="settingsFields"></div>
  <button type="button" class="tour-replay" id="tourReplay">Revoir la visite guidée</button>
  <a class="privacy-link" id="privacyPolicyLink" href="guides/confidentialite.html">Confidentialité</a>
  <div class="settings-actions">
    <button type="button" class="settings-cancel" id="settingsCancel">Annuler</button>
    <button type="button" class="settings-save" id="settingsSave">Enregistrer</button>
  </div>
</section>

<script src="config.js"></script>
<script>
(function () {
  "use strict";

  /* ---- Constantes du contrat PWA (identiques côté moteurs) ---- */
  var FRAME_READY_TIMEOUT_MS = 45000;
  var ENGINE_ORIGIN_RE = /^https:\/\/(?:[a-z0-9-]+-)?script\.googleusercontent\.com$/i;

  /* Instances (bêta / perso) publiées sur la même origine : chaque instance a
     son propre espace de stockage local pour éviter toute collision. */
  var INSTANCE = String(window.STONE_PWA_INSTANCE || "default");
  var OVERRIDES_KEY = "STONE_PWA_URL_OVERRIDES::" + INSTANCE;

  /* Surcharges d'URL par appareil (localStorage) : permettent une coque
     publiée sans aucune adresse personnelle dans son code (config vide),
     chaque appareil renseignant ses moteurs une seule fois. */
  function readOverrides() {
    try { return JSON.parse(localStorage.getItem(OVERRIDES_KEY) || "{}") || {}; }
    catch (e) { return {}; }
  }
  function effectiveUrl(u) {
    var override = String(readOverrides()[u.key] || "").trim();
    if (/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/.test(override)) return override;
    return u.url;
  }

  var UNIVERSES = Array.isArray(window.STONE_PWA_UNIVERSES) ? window.STONE_PWA_UNIVERSES : [];
  var stage = document.getElementById("stage");
  var nav = document.getElementById("universeNav");
  var tagline = document.getElementById("universeTagline");

  /* Etat par univers : iframe vivant, nonce, source de confiance, timers.
     Les iframes ne sont jamais détruits au changement d'univers : on passe
     de l'un à l'autre sans recharger (exigence "suite STONE"). */
  var frames = {};
  var activeKey = "";

  function universe(key) {
    for (var i = 0; i < UNIVERSES.length; i++) if (UNIVERSES[i].key === key) return UNIVERSES[i];
    return null;
  }

  function makeNonce() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "");
    var out = "";
    for (var i = 0; i < 32; i++) out += "abcdefghijklmnopqrstuvwxyz0123456789"[Math.floor(Math.random() * 36)];
    return out;
  }

  function framedUrl(u, nonce) {
    var url = new URL(effectiveUrl(u));
    if (u.query) Object.keys(u.query).forEach(function (k) { url.searchParams.set(k, u.query[k]); });
    url.searchParams.set("pwa", "1");
    url.searchParams.set("pwa_origin", window.location.origin);
    url.searchParams.set("pwa_nonce", nonce);
    return url.toString();
  }

  /* ---- Panneaux d'état (chargement / erreur / univers non raccordé) ---- */
  function panel(u, kind) {
    var el = document.createElement("div");
    el.className = "stage-panel";
    el.style.setProperty("--u-accent", u.accent);
    el.dataset.universe = u.key;
    el.dataset.kind = kind;
    if (kind === "loading") {
      el.setAttribute("role", "status");
      el.innerHTML =
        '<section><div class="mark" aria-hidden="true">' + u.glyph + "</div>" +
        '<p class="eyebrow">Connexion sécurisée</p>' +
        "<h1>Ouverture de STONE " + u.label + "</h1>" +
        "<p>Connexion à ton espace " + u.label + "…</p>" +
        '<div class="loading-line" aria-hidden="true"><span></span></div></section>';
    } else if (kind === "error") {
      el.setAttribute("role", "alert");
      el.innerHTML =
        '<section><div class="mark" aria-hidden="true">' + u.glyph + "</div>" +
        "<h1>STONE " + u.label + " n’a pas pu s’ouvrir</h1>" +
        "<p>Première visite ? Google demande une autorisation qui ne peut pas s’afficher ici : " +
        "ouvrez " + u.label + " une fois dans le navigateur, acceptez, puis revenez réessayer.</p>" +
        '<p class="warn-hint">Google va d’abord afficher <b>« Cette application n’a pas été vérifiée »</b> — ' +
        'normal pour un projet indépendant à ce stade, pas un signe de danger : ' +
        'touche <b>Paramètres avancés</b> puis <b>Accéder à STONE ' + u.label + '</b> pour continuer. ' +
        'Tes données restent dans ton propre compte Google, jamais sur un serveur STONE.</p>' +
        '<button class="primary-button" type="button" data-authorize="' + u.key + '">Autoriser dans le navigateur</button>' +
        '<div style="height:10px"></div>' +
        '<button class="quiet-button" type="button" data-retry="' + u.key + '">Réessayer ici</button></section>';
    } else if (kind === "disabled") {
      var apercu = u.preview || {};
      var puces = (apercu.points || []).map(function (point) {
        return '<li>' + point + "</li>";
      }).join("");
      el.innerHTML =
        '<section class="soon"><div class="mark" aria-hidden="true">' + u.glyph + "</div>" +
        '<p class="eyebrow">Bientôt</p>' +
        "<h1>STONE " + u.label + "</h1>" +
        "<p class=\"soon-lead\">" + (apercu.lead || "Cet univers arrive bientôt dans STONE.") + "</p>" +
        (apercu.shot
          ? '<div class="soon-shot"><img src="' + apercu.shot + '" alt="Aperçu de STONE ' + u.label +
            '" loading="lazy" decoding="async" width="750" height="1240"><span class="soon-fade" aria-hidden="true"></span></div>'
          : "") +
        (puces ? '<ul class="soon-points">' + puces + "</ul>" : "") +
        (apercu.guide
          ? '<a class="quiet-button soon-guide" href="' + apercu.guide + '">Découvrir ' + u.label + "</a>"
          : "") +
        "</section>";
    } else if (kind === "configure") {
      el.innerHTML =
        '<section><div class="mark" aria-hidden="true">' + u.glyph + "</div>" +
        '<p class="eyebrow">Configuration requise</p>' +
        "<h1>STONE " + u.label + "</h1>" +
        "<p>Renseignez l’adresse du moteur " + u.label + " dans les réglages. Elle restera uniquement sur cet appareil.</p>" +
        '<button class="primary-button" type="button" data-open-settings="1">Ouvrir les réglages</button></section>';
    } else {
      el.setAttribute("role", "status");
      el.innerHTML =
        '<section><div class="mark" aria-hidden="true"><svg viewBox=\"0 0 24 24\" width=\"1em\" height=\"1em\" aria-hidden=\"true\"><path d=\"M12 2 L2 20 H12 Z\" fill=\"currentColor\" opacity=\".6\"/><path d=\"M12 2 L22 20 H12 Z\" fill=\"currentColor\"/><path d=\"M12 2 L12 20\" stroke=\"currentColor\" stroke-opacity=\".28\" stroke-width=\".7\"/></svg></div>' +
        "<h1>Connexion indisponible</h1>" +
        "<p>STONE nécessite une connexion pour afficher vos univers. Aucune donnée financière n’est servie depuis le cache.</p>" +
        '<button class="primary-button" type="button" data-retry="__reload__">Réessayer</button></section>';
    }
    stage.appendChild(el);
    return el;
  }

  function setPanelVisible(state, kind) {
    ["loadingPanel", "errorPanel", "disabledPanel"].forEach(function (name) {
      if (state[name]) state[name].classList.toggle("is-visible", name === kind);
    });
  }

  /* ---- Cycle de vie d'un univers ---- */
  function mountUniverse(u) {
    var state = {
      universe: u,
      nonce: "",
      loaded: false,
      trustedSource: null,
      trustedOrigin: "",
      timeoutId: null,
      startedAt: 0,
      iframe: null,
      loadingPanel: panel(u, "loading"),
      errorPanel: panel(u, "error"),
      disabledPanel: null
    };
    frames[u.key] = state;
    startFrame(state);
    return state;
  }

  function startFrame(state) {
    var u = state.universe;
    state.nonce = makeNonce();
    state.loaded = false;
    state.trustedSource = null;
    state.trustedOrigin = "";
    state.startedAt = performance.now();
    if (state.timeoutId) clearTimeout(state.timeoutId);
    state.timeoutId = setTimeout(function () {
      if (state.loaded) return;
      if (state.errorPanel) state.errorPanel.dataset.shown = "1";
      syncVisibility();
    }, FRAME_READY_TIMEOUT_MS);

    if (state.iframe) { stage.removeChild(state.iframe); state.iframe = null; }
    var iframe = document.createElement("iframe");
    iframe.title = "STONE " + u.label;
    iframe.referrerPolicy = "origin";
    iframe.setAttribute("allow", "clipboard-write");
    iframe.dataset.universe = u.key;
    iframe.src = framedUrl(u, state.nonce);
    state.iframe = iframe;
    stage.appendChild(iframe);
    setPanelVisible(state, "loadingPanel");
    syncVisibility();
  }

  function mountDisabled(u) {
    var state = { universe: u, disabledPanel: panel(u, "disabled"), loadingPanel: null, errorPanel: null, iframe: null, loaded: false };
    frames[u.key] = state;
    setPanelVisible(state, "disabledPanel");
    return state;
  }

  function mountConfigure(u) {
    var state = { universe: u, disabledPanel: panel(u, "configure"), loadingPanel: null, errorPanel: null, iframe: null, loaded: false };
    frames[u.key] = state;
    setPanelVisible(state, "disabledPanel");
    return state;
  }

  /* Après un changement de réglages : détruire les états pour re-monter
     les univers avec leurs nouvelles adresses. */
  function remountAll() {
    for (var key in frames) {
      var state = frames[key];
      if (state.timeoutId) clearTimeout(state.timeoutId);
      if (state.iframe) stage.removeChild(state.iframe);
      ["loadingPanel", "errorPanel", "disabledPanel"].forEach(function (name) {
        if (state[name]) stage.removeChild(state[name]);
      });
    }
    frames = {};
    if (activeKey) activate(activeKey, false);
  }

  /* ---- Handshake : CHALLENGE (moteur) → ACK (coque) → READY (moteur) ---- */
  window.addEventListener("message", function (event) {
    if (!ENGINE_ORIGIN_RE.test(event.origin)) return;
    var data = event.data || {};
    if (!event.source || typeof data.type !== "string") return;
    for (var key in frames) {
      var state = frames[key];
      if (!state || !state.nonce || data.nonce !== state.nonce) continue;
      var prefix = state.universe.msgPrefix;
      if (data.type === prefix + "_CHALLENGE") {
        state.trustedSource = event.source;
        state.trustedOrigin = event.origin;
        state.trustedSource.postMessage({ type: prefix + "_ACK", nonce: state.nonce }, event.origin);
        return;
      }
      if (data.type === prefix + "_READY") {
        if (event.source !== state.trustedSource || event.origin !== state.trustedOrigin) return;
        if (state.timeoutId) { clearTimeout(state.timeoutId); state.timeoutId = null; }
        state.loaded = true;
        setPanelVisible(state, "");
        if (state.iframe) state.iframe.classList.add("is-visible");
        document.documentElement.dataset.shellReady = "true";
        document.documentElement.dataset.shellLoadMs = String(Math.round(performance.now() - state.startedAt));
        syncVisibility();
        requestWealth(state);
        return;
      }
      if (data.type === prefix + "_WEALTH") {
        if (event.source !== state.trustedSource || event.origin !== state.trustedOrigin) return;
        applyWealth(key, data.snapshot);
        return;
      }
    }
  });

  /* ---- Navigation entre univers ---- */
  function syncVisibility() {
    for (var key in frames) {
      var state = frames[key];
      var isActive = key === activeKey;
      if (state.iframe) state.iframe.classList.toggle("is-visible", isActive && state.loaded);
      ["loadingPanel", "errorPanel", "disabledPanel"].forEach(function (name) {
        if (state[name] && !isActive) state[name].classList.remove("is-visible");
      });
      if (isActive && !state.loaded) {
        if (state.disabledPanel) setPanelVisible(state, "disabledPanel");
        else if (state.errorPanel && state.errorPanel.dataset.shown === "1") setPanelVisible(state, "errorPanel");
        else if (state.loadingPanel) setPanelVisible(state, "loadingPanel");
      }
    }
  }

  /* ---- Inventaire du patrimoine ---------------------------------------
     La coque ne calcule aucun patrimoine : elle demande a chaque univers son
     seul etage et cite la reponse. Trois regles tiennent cet ecran :

     1. **Rien n'est stocke.** Le montant vit dans cette page, le temps de
        l'affichage. Ni cache, ni stockage navigateur, ni serveur.
     2. **L'accueil ne depend jamais de l'inventaire.** La pyramide et les
        portes s'affichent entierement avec zero moteur qui repond. Un univers
        muet laisse simplement sa rangee telle quelle.
     3. **Aucune somme.** Additionner une cloture BRVM officielle a une
        estimation declaree produirait un nombre indefendable. Chaque etage
        porte son chiffre, sa nature de preuve et sa fraicheur — separement.

     Le montant traverse une frontiere postMessage : il n'est accepte que du
     `trustedSource` du handshake, a son origine exacte, avec le bon nonce. */
  var wealth = {};

  function requestWealth(state) {
    if (!state || !state.trustedSource || !state.trustedOrigin || !state.nonce) return;
    state.trustedSource.postMessage(
      { type: state.universe.msgPrefix + "_WEALTH_QUERY", nonce: state.nonce },
      state.trustedOrigin
    );
  }

  function moneyFormat(value) {
    try { return new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 }).format(value) + " XOF"; }
    catch (e) { return String(value) + " XOF"; }
  }

  /* « aujourd'hui », « hier », sinon la date courte : l'ISO brut n'atteint
     jamais l'ecran, ici comme dans les applications. */
  function wealthFreshness(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var jour = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var now = new Date();
    var aujourdhui = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var ecart = Math.round((aujourdhui - jour) / 86400000);
    if (ecart <= 0) return "aujourd’hui";
    if (ecart === 1) return "hier";
    /* Au-dela d'un an, « le 12 mars » serait ambigu : l'annee devient
       necessaire, surtout pour une estimation immobiliere qui peut dormir. */
    var options = ecart > 330
      ? { day: "numeric", month: "long", year: "numeric" }
      : { day: "numeric", month: "long" };
    try { return "le " + new Intl.DateTimeFormat("fr-FR", options).format(d); }
    catch (e) { return ""; }
  }

  /* Un univers ferme le dit des l'accueil : personne ne doit cliquer pour
     l'apprendre. On reutilise la colonne du montant, qui est exactement la
     place ou l'oeil cherche l'etat de l'etage. */
  function markSoonUniverses() {
    if (!homeEl) return;
    UNIVERSES.forEach(function (u) {
      if (u.enabled) return;
      var valueEl = homeEl.querySelector('[data-wealth-value="' + u.key + '"]');
      var row = valueEl && valueEl.closest(".home-row");
      if (!valueEl || !row) return;
      row.classList.add("has-value", "is-soon");
      valueEl.className = "r-value is-empty";
      valueEl.textContent = "Bientôt";
    });
  }

  function applyWealth(key, snapshot) {
    wealth[key] = snapshot || null;
    if (!homeEl) return;
    var valueEl = homeEl.querySelector('[data-wealth-value="' + key + '"]');
    var noteEl = homeEl.querySelector('[data-wealth-note="' + key + '"]');
    var row = valueEl && valueEl.closest(".home-row");
    if (!valueEl || !row) return;

    var u = universe(key);
    var etat = snapshot && snapshot.state;

    if (!snapshot || snapshot.ok !== true || etat === "UNAVAILABLE") {
      /* Univers muet : on ne dit rien plutot que de dire faux. La rangee
         reste ce qu'elle etait. */
      row.classList.remove("has-value");
      valueEl.textContent = "";
      if (noteEl && u) noteEl.textContent = u.tagline;
      return;
    }

    if (etat === "PRIVACY") {
      row.classList.add("has-value");
      valueEl.className = "r-value";
      valueEl.textContent = "•••";
      if (noteEl) noteEl.textContent = "Masqué à ta demande";
      return;
    }

    if (etat === "EMPTY" || snapshot.amountXOF == null) {
      row.classList.add("has-value");
      valueEl.className = "r-value is-empty";
      valueEl.textContent = "Non renseigné";
      if (noteEl && u) noteEl.textContent = u.tagline;
      return;
    }

    var partiel = snapshot.proof === "PARTIEL";
    row.classList.add("has-value");
    valueEl.className = "r-value";
    valueEl.innerHTML = '<span class="' + (partiel ? "rv-partial" : "") + '">' +
      moneyFormat(Number(snapshot.amountXOF)) + "</span>";
    if (noteEl) noteEl.textContent = wealthNote(key, snapshot, partiel);
  }

  /* La phrase sous le montant dit d'ou vient le chiffre. Un solde saisi a la
     main et une estimation declaree ne doivent jamais se lire comme une
     cloture officielle : c'est toute la difference entre les trois etages. */
  function wealthNote(key, snapshot, partiel) {
    var quand = wealthFreshness(snapshot.asOf);
    if (key === "invest") {
      if (partiel) return "Valorisation partielle · " + snapshot.pricedPositionCount + "/" + snapshot.positionCount + " titres cotés";
      return "Clôture BRVM" + (quand ? " · " + quand : "");
    }
    if (key === "money") {
      var base = "Soldes saisis" + (quand ? " · dernier mouvement " + quand : "");
      /* La convention de signe d'un compte de dette appartient a
         l'utilisateur : on ne la deduit pas, on dit que le chiffre est brut. */
      if (Number(snapshot.debtAccountCount || 0) > 0) {
        return base + " · hors " + snapshot.debtAccountCount + " compte(s) de dette";
      }
      return base;
    }
    if (key === "estate") {
      if (partiel) return "Estimations déclarées · " + snapshot.valuedAssetCount + "/" + snapshot.assetCount + " biens estimés";
      return "Estimation déclarée" + (quand ? " · la plus ancienne " + quand : "");
    }
    return quand ? "Mis à jour " + quand : "";
  }

  /* Monte en arriere-plan les univers qui alimentent l'inventaire. Appele
     seulement quand l'accueil est affiche, une fois par session, et jamais de
     maniere bloquante : si le montage echoue ou traine, l'accueil ne bouge pas.
     Les trois univers repondent au meme contrat ; l'ordre suit la pyramide,
     de la base au sommet. */
  var wealthMounted = {};
  function ensureWealthFrames() {
    ["money", "invest", "estate"].forEach(function (key) {
      if (wealthMounted[key]) return;
      var u = universe(key);
      if (!u || !u.enabled || !effectiveUrl(u)) return;
      wealthMounted[key] = true;
      var state = frames[key];
      if (!state) state = mountUniverse(u);
      else if (state.loaded) requestWealth(state);
    });
  }

  /* ---- Accueil : la pyramide STONE complète, chaque tranche ouvre son univers
     (Money la base, Invest l'étage, Estate la pointe — couleurs du registre). ---- */
  var homeEl = null;
  function pyramidSlice(u, path, detail, labelX, labelY, labelSize) {
    if (!u) return "";

      '<path d="' + path + '" fill="' + u.accent + '"/>' + (detail || "") +
      '<text x="' + labelX + '" y="' + labelY + '" text-anchor="middle" font-size="' + labelSize + '">' + u.label.toUpperCase() + "</text></g>";
  }
  function showHome() {
    if (!homeEl) {
      var byKey = {};
      UNIVERSES.forEach(function (u) { byKey[u.key] = u; });
      var others = UNIVERSES.filter(function (u) {
        return u.enabled && u.key !== "money" && u.key !== "invest" && u.key !== "estate";
      });
      homeEl = document.createElement("div");
      homeEl.className = "stage-panel home-panel";
      homeEl.dataset.kind = "home";
      homeEl.innerHTML =
        '<section><div class="mark" aria-hidden="true"><svg viewBox=\"0 0 24 24\" width=\"1em\" height=\"1em\" aria-hidden=\"true\"><path d=\"M12 2 L2 20 H12 Z\" fill=\"currentColor\" opacity=\".6\"/><path d=\"M12 2 L22 20 H12 Z\" fill=\"currentColor\"/><path d=\"M12 2 L12 20\" stroke=\"currentColor\" stroke-opacity=\".28\" stroke-width=\".7\"/></svg></div>' +
        '<p class="eyebrow">La suite STONE</p>' +
        "<h1>Ta pyramide patrimoniale</h1>" +
        '<div class="pyr-wrap"><svg class="pyr" viewBox="0 0 260 200" role="group" aria-label="Pyramide STONE : Money la base, Invest l’étage, Estate la pointe">' +
        '<defs>' +
          '<radialGradient id="stoneGlowGrad" cx="50%" cy="62%" r="52%">' +
            '<stop offset="0%" stop-color="#c9a567" stop-opacity=".30"/>' +
            '<stop offset="100%" stop-color="#c9a567" stop-opacity="0"/></radialGradient>' +
          '<linearGradient id="stoneSheenGrad" x1="0" y1="0" x2="1" y2="0">' +
            '<stop offset="0%" stop-color="#fff6de" stop-opacity="0"/>' +
            '<stop offset="50%" stop-color="#fff6de" stop-opacity=".62"/>' +
            '<stop offset="100%" stop-color="#fff6de" stop-opacity="0"/></linearGradient>' +
          '<clipPath id="stonePyrClip">' +
            '<path d="M130 10 L162 62 H98 Z"/><path d="M93 70 H167 L199 122 H61 Z"/><path d="M56 130 H204 L236 182 H24 Z"/>' +
          '</clipPath>' +
        '</defs>' +
        '<ellipse class="pyr-glow" cx="130" cy="124" rx="126" ry="92" fill="url(#stoneGlowGrad)"/>' +
        pyramidSlice(byKey.estate, "M130 10 L162 62 H98 Z",
          /* libellé descendu et réduit : à y=44 en 9px il débordait de la pointe */
          '<path class="detail" d="M124 62 V51 H136 V62"/>', 130, 48, 7) +
        pyramidSlice(byKey.invest, "M93 70 H167 L199 122 H61 Z",
          '<path class="detail" d="M86 109 L112 95 L132 102 L156 89"/><circle class="detail" cx="156" cy="89" r="2" fill="rgba(18,13,4,.5)" stroke="none"/>', 130, 104, 12) +
        pyramidSlice(byKey.money, "M56 130 H204 L236 182 H24 Z",
          '<path class="detail" d="M60 166 H200"/>', 130, 160, 13) +
        '<path class="pyr-plinth" d="M22 188 H238" stroke="#c9a567" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round" fill="none"/>' +
        '<g clip-path="url(#stonePyrClip)" aria-hidden="true"><rect class="pyr-sheen" x="-56" y="0" width="52" height="200" fill="url(#stoneSheenGrad)"/></g>' +
        "</svg></div>" +
        '<p class="home-hint">Money soutient tout, Invest fait grandir, Estate couronne.</p>' +
        '<div class="home-rows">' + ["money", "invest", "estate"].map(function (key) {
          var u = byKey[key];
          if (!u) return "";
          return '<button class="home-row" type="button" data-go="' + u.key + '" style="--u-accent:' + u.accent + '">' +
            '<span class="r-mark" aria-hidden="true">' + u.glyph + "</span>" +
            '<span class="r-copy"><span class="r-name">' + u.label + '</span>' +
            '<span class="r-sub" data-wealth-note="' + u.key + '">' + u.tagline + "</span></span>" +
            '<span class="r-value" data-wealth-value="' + u.key + '"></span>' +
            '<span class="r-go" aria-hidden="true">→</span></button>';
        }).join("") + "</div>" +
        '<p class="home-guides"><a href="guides/">Découvrir la suite — les guides</a></p>' +
        '<p class="home-trust">Tes chiffres restent dans ton espace privé. STONE ne les conserve jamais.</p>' +
        (others.length
          ? '<p style="margin-top:16px">' + others.map(function (u) {
              return '<button class="quiet-button" type="button" data-go="' + u.key + '">' + u.glyph + " " + u.label + "</button>";
            }).join(" ") + "</p>"
          : "") +
        "</section>";
      stage.appendChild(homeEl);
      homeEl.addEventListener("click", function (event) {
        var go = event.target.closest && event.target.closest("[data-go]");
        if (go) activate(go.dataset.go, true);
      });
      homeEl.addEventListener("keydown", function (event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        var go = event.target.closest && event.target.closest("[data-go]");
        if (go) { event.preventDefault(); activate(go.dataset.go, true); }
      });
    }
    activeKey = "";
    tagline.textContent = "Chaque tranche porte la suivante";
    Array.prototype.forEach.call(nav.querySelectorAll("button[data-universe]"), function (btn) {
      btn.classList.remove("active");
      btn.setAttribute("aria-current", "false");
    });
    syncVisibility();
    UNIVERSES.forEach(function (u) {
      if (u.enabled) return;
      var tranche = homeEl.querySelector('.pyr [data-go="' + u.key + '"]');
      if (tranche) tranche.classList.add("is-soon");
    });
    homeEl.classList.add("is-visible");
    markSoonUniverses();
    /* L'inventaire demarre APRES la peinture de l'accueil : il ne doit jamais
       en retarder l'affichage ni ses portes. */
    if (window.requestAnimationFrame) requestAnimationFrame(ensureWealthFrames);
    else setTimeout(ensureWealthFrames, 0);
    /* Première ouverture : la visite démarre une fois la cinématique posée. */
    if (!tourSeen()) setTimeout(function () { tourStart(); }, 2300);
    /* L'URL redevient celle du hall d'entrée : un rechargement ou un partage
       depuis l'accueil ne renvoie pas dans le dernier univers visité. */
    try {
      var home = new URL(window.location.href);
      if (home.searchParams.has("u")) {
        home.searchParams.delete("u");
        history.replaceState(null, "", home.toString());
      }
    } catch (e) {}
    /* Le fondu d'entrée est porté par le CSS (@keyframes home-in sur
       .home-panel.is-visible) : aucune bascule JS, donc aucun risque de rester
       invisible ; prefers-reduced-motion coupe l'animation plus bas. */
  }

  /* ---- Visite guidée de la coque ----
     Elle explique la maison (pyramide, univers, guides, barre, logo), jamais
     l'intérieur d'un univers : ceux-ci sont des pages isolées que la coque ne
     peut pas annoter, et c'est cette isolation qui protège les données. */
  var TOUR_KEY = "STONE_PWA_TOUR_SEEN::" + INSTANCE;
  var TOUR_STEPS = [
    { sel: ".home-panel .pyr", titre: "Ta pyramide patrimoniale",
      texte: "Trois étages d'un même patrimoine. Chaque tranche porte la suivante : sans revenu maîtrisé, pas d'épargne ; sans capital, pas de pierre." },
    { sel: '.home-panel .pyr [data-go="money"]', titre: "La base : Money",
      texte: "Ce que ton revenu libère réellement chaque mois, une fois les dépenses et les remboursements comptés." },
    { sel: '.home-panel .pyr [data-go="invest"]', titre: "L'étage : Invest",
      texte: "Ce que ton épargne devient à la BRVM, et ce qu'elle rapporte vraiment une fois les frais payés." },
    { sel: '.home-panel .pyr [data-go="estate"]', titre: "La pointe : Estate",
      texte: "Ce que ton capital devient en pierre : tes biens, leur coût réel et leurs papiers." },
    { sel: ".home-rows", titre: "Entrer dans un univers",
      texte: "Touche une tranche de la pyramide ou sa rangée ici : les deux mènent au même endroit." },
    { sel: ".home-guides a", titre: "Les guides",
      texte: "Chaque univers a son guide : à quoi il sert, ce qu'il change pour toi, comment commencer." },
    { sel: ".universe-nav", titre: "Passer d'un univers à l'autre",
      texte: "Cette barre reste toujours là. Tu changes d'univers sans rien recharger ni perdre ta place." },
    { sel: "#brandHomeButton", titre: "Revenir ici",
      texte: "Ce logo te ramène toujours à la pyramide. Et la molette garde une entrée pour revoir cette visite." }
  ];
  var tour = { i: 0, spot: null, card: null, open: false, onResize: null };

  function tourSeen() { try { return localStorage.getItem(TOUR_KEY) === "1"; } catch (e) { return true; } }
  function tourRemember() { try { localStorage.setItem(TOUR_KEY, "1"); } catch (e) {} }

  function tourPlace() {
    var step = TOUR_STEPS[tour.i];
    var el = document.querySelector(step.sel);
    if (!el) { tourNext(); return; }
    var r = el.getBoundingClientRect();
    var pad = 8;
    tour.spot.style.top = Math.max(4, r.top - pad) + "px";
    tour.spot.style.left = Math.max(4, r.left - pad) + "px";
    tour.spot.style.width = Math.min(window.innerWidth - 8, r.width + pad * 2) + "px";
    tour.spot.style.height = Math.min(window.innerHeight - 8, r.height + pad * 2) + "px";

    tour.card.querySelector(".step").textContent = "Étape " + (tour.i + 1) + " sur " + TOUR_STEPS.length;
    tour.card.querySelector("h2").textContent = step.titre;
    tour.card.querySelector(".txt").textContent = step.texte;
    tour.card.querySelector(".tour-next").textContent =
      tour.i === TOUR_STEPS.length - 1 ? "Terminer" : "Suivant";
    Array.prototype.forEach.call(tour.card.querySelectorAll(".tour-dots i"), function (dot, n) {
      dot.classList.toggle("on", n === tour.i);
    });

    /* La bulle se pose sous la cible, ou au-dessus si elle depasserait l'ecran. */
    var cr = tour.card.getBoundingClientRect();
    var dessous = r.bottom + 12;
    var top = dessous + cr.height > window.innerHeight - 8 ? Math.max(8, r.top - cr.height - 12) : dessous;
    var left = Math.min(Math.max(8, r.left + r.width / 2 - cr.width / 2), window.innerWidth - cr.width - 8);
    tour.card.style.top = top + "px";
    tour.card.style.left = left + "px";
  }

  function tourNext() {
    tour.i += 1;
    if (tour.i >= TOUR_STEPS.length) { tourEnd(); return; }
    tourPlace();
  }

  function tourEnd() {
    tour.open = false;
    tourRemember();
    if (tour.spot) { tour.spot.remove(); tour.spot = null; }
    if (tour.card) { tour.card.remove(); tour.card = null; }
    if (tour.onResize) { window.removeEventListener("resize", tour.onResize); tour.onResize = null; }
    var home = document.querySelector("#brandHomeButton");
    if (home) home.focus({ preventScroll: true });
  }

  function tourStart() {
    if (tour.open || !homeEl || !homeEl.classList.contains("is-visible")) return;
    tour.open = true;
    tour.i = 0;
    tour.spot = document.createElement("div");
    tour.spot.className = "tour-spot";
    tour.card = document.createElement("section");
    tour.card.className = "tour-card";
    tour.card.setAttribute("role", "dialog");
    tour.card.setAttribute("aria-label", "Visite guidée de STONE");
    tour.card.innerHTML =
      '<p class="step"></p><h2></h2><p class="txt"></p>' +
      '<div class="tour-actions"><span class="tour-dots">' +
      TOUR_STEPS.map(function () { return "<i></i>"; }).join("") +
      '</span><button type="button" class="tour-skip">Passer</button>' +
      '<button type="button" class="tour-next">Suivant</button></div>';
    document.body.appendChild(tour.spot);
    document.body.appendChild(tour.card);
    tour.card.querySelector(".tour-next").addEventListener("click", tourNext);
    tour.card.querySelector(".tour-skip").addEventListener("click", tourEnd);
    tour.onResize = function () { if (tour.open) tourPlace(); };
    window.addEventListener("resize", tour.onResize);
    document.addEventListener("keydown", function esc(event) {
      if (!tour.open) { document.removeEventListener("keydown", esc); return; }
      if (event.key === "Escape") { event.preventDefault(); tourEnd(); }
      else if (event.key === "Enter" || event.key === "ArrowRight") { event.preventDefault(); tourNext(); }
    });
    tourPlace();
    tour.card.querySelector(".tour-next").focus({ preventScroll: true });
  }

  function activate(key, fromUser) {
    if (tour.open) tourEnd();

    var u = universe(key);
    if (!u) return;
    if (homeEl) homeEl.classList.remove("is-visible");
    activeKey = key;
    tagline.textContent = u.label + " · " + u.tagline;
    Array.prototype.forEach.call(nav.querySelectorAll("button[data-universe]"), function (btn) {
      var on = btn.dataset.universe === key;
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-current", on ? "page" : "false");
      btn.style.setProperty("--u-accent", universe(btn.dataset.universe).accent);
    });
    if (!frames[key]) {
      if (!u.enabled) mountDisabled(u);
      else if (effectiveUrl(u)) mountUniverse(u);
      else mountConfigure(u);
    }
    syncVisibility();
    if (fromUser) {
      /* Pas de mémorisation persistante du dernier univers (v9) : seul l'URL
         courante porte l'univers actif, pour que le rechargement d'un lien
         profond reste fidèle et que le lancement retombe sur la pyramide. */
      try {
        var qs = new URL(window.location.href);
        qs.searchParams.set("u", key);
        history.replaceState(null, "", qs.toString());
      } catch (e) {}
    }
  }

  UNIVERSES.forEach(function (u) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.dataset.universe = u.key;
    btn.innerHTML = '<span class="glyph" aria-hidden="true">' + u.glyph + "</span><span>" + u.label + "</span>";
    btn.addEventListener("click", function () { activate(u.key, true); });
    nav.appendChild(btn);
  });

  stage.addEventListener("click", function (event) {
    if (event.target.closest && event.target.closest("[data-open-settings]")) { openSettings(); return; }
    var authorize = event.target.closest && event.target.closest("[data-authorize]");
    if (authorize) {
      /* Consentement Google impossible en iframe : ouvrir le moteur en direct
         (sans paramètres pwa), l'utilisateur accepte, puis réessaie ici. */
      var au = universe(authorize.dataset.authorize);
      if (au) {
        var direct = new URL(effectiveUrl(au));
        if (au.query) Object.keys(au.query).forEach(function (k) { direct.searchParams.set(k, au.query[k]); });
        window.open(direct.toString(), "_blank", "noopener");
      }
      return;
    }
    var retry = event.target.closest && event.target.closest("[data-retry]");
    if (!retry) return;
    if (retry.dataset.retry === "__reload__") { window.location.reload(); return; }
    var state = frames[retry.dataset.retry];
    if (state) { if (state.errorPanel) state.errorPanel.dataset.shown = "0"; startFrame(state); }
  });

  /* ---- Réglages des univers (bottom-sheet, stockage local uniquement) ---- */
  var settingsSheet = document.getElementById("settingsSheet");
  var sheetBackdrop = document.getElementById("sheetBackdrop");
  var settingsFields = document.getElementById("settingsFields");
  function openSettings() {
    var overrides = readOverrides();
    settingsFields.innerHTML = "";
    UNIVERSES.forEach(function (u) {
      if (!u.enabled) return;
      var field = document.createElement("div");
      field.className = "settings-field";
      var label = document.createElement("label");
      label.textContent = "Moteur " + u.label + (u.url ? "" : " (requis)");
      label.htmlFor = "setting-" + u.key;
      var input = document.createElement("input");
      input.type = "url";
      input.id = "setting-" + u.key;
      input.dataset.universe = u.key;
      input.placeholder = u.url ? "Par défaut : coque" : "https://script.google.com/macros/s/…/exec";
      input.value = overrides[u.key] || "";
      input.setAttribute("autocomplete", "off");
      input.setAttribute("spellcheck", "false");
      field.appendChild(label);
      field.appendChild(input);
      settingsFields.appendChild(field);
    });
    settingsSheet.classList.add("is-open");
    sheetBackdrop.classList.add("is-open");
  }
  function closeSettings() {
    settingsSheet.classList.remove("is-open");
    sheetBackdrop.classList.remove("is-open");
  }
  document.getElementById("settingsButton").addEventListener("click", openSettings);
  document.getElementById("settingsCancel").addEventListener("click", closeSettings);
  sheetBackdrop.addEventListener("click", closeSettings);
  document.getElementById("settingsSave").addEventListener("click", function () {
    var overrides = {};
    Array.prototype.forEach.call(settingsFields.querySelectorAll("input[data-universe]"), function (input) {
      var value = String(input.value || "").trim().replace(/\?.*$/, "");
      if (/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(value)) {
        overrides[input.dataset.universe] = value;
      }
    });
    try { localStorage.setItem(OVERRIDES_KEY, JSON.stringify(overrides)); } catch (e) {}
    closeSettings();
    remountAll();
  });

  /* ---- Connexion ---- */
  var pill = document.getElementById("connectionPill");
  var pillLabel = document.getElementById("connectionLabel");
  function syncOnline() {
    var online = navigator.onLine;
    pill.classList.toggle("is-online", online);
    pillLabel.textContent = online ? "Connecté" : "Hors connexion";
  }
  window.addEventListener("online", syncOnline);
  window.addEventListener("offline", syncOnline);
  syncOnline();

  /* ---- Installation ---- */
  var installButton = document.getElementById("installButton");
  var appleNotice = document.getElementById("appleNotice");
  var deferredPrompt = null;
  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }
  function isAppleMobile() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
  /* Navigateurs intégrés à d'autres applications (Instagram, Messenger, Line,
     WeChat, TikTok, LinkedIn, Snapchat...) : l'installation y est impossible,
     et ni beforeinstallprompt ni le partage iOS n'y fonctionnent normalement.
     WhatsApp n'a volontairement pas de test dédié : il ouvre les liens dans le
     navigateur du système (Chrome/Custom Tabs, Safari), pas dans une vue
     intégrée, et son UA ne se distingue pas — un test le visant serait un
     faux repère, pas une vraie détection. */
  function isInAppBrowser() {
    return /FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|Snapchat|TikTok|musical_ly|LinkedInApp/i.test(navigator.userAgent || "");
  }
  var inAppNotice = document.getElementById("inAppNotice");
  var inAppNoticeText = document.getElementById("inAppNoticeText");
  if (isInAppBrowser() && !isStandalone()) {
    inAppNoticeText.textContent = isAppleMobile()
      ? "Ce lien s’est ouvert dans le navigateur d’une autre application : l’installation n’est pas possible ici. Touche ⋯ puis « Ouvrir dans Safari »."
      : "Ce lien s’est ouvert dans le navigateur d’une autre application : l’installation n’est pas possible ici. Touche ⋮ puis « Ouvrir dans Chrome ».";
    inAppNotice.hidden = false;
  }
  window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();
    deferredPrompt = event;
    if (!isStandalone() && !isInAppBrowser()) installButton.hidden = false;
  });
  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
    installButton.hidden = true;
    appleNotice.hidden = true;
  });
  if (isAppleMobile() && !isStandalone() && !isInAppBrowser()) installButton.hidden = false;
  installButton.addEventListener("click", function () {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
    } else if (isAppleMobile()) {
      appleNotice.hidden = false;
    }
  });
  document.getElementById("appleNoticeClose").addEventListener("click", function () { appleNotice.hidden = true; });

  /* ---- Service worker + mise à jour contrôlée ---- */
  var updateNotice = document.getElementById("updateNotice");
  var updateButton = document.getElementById("updateButton");
  var waitingWorker = null;
  function offerUpdate(worker) { waitingWorker = worker; updateNotice.hidden = false; }
  updateButton.addEventListener("click", function () {
    if (waitingWorker) waitingWorker.postMessage({ type: "SKIP_WAITING" });
  });
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (registration) {
      if (registration.waiting) offerUpdate(registration.waiting);
      registration.addEventListener("updatefound", function () {
        var candidate = registration.installing;
        if (!candidate) return;
        candidate.addEventListener("statechange", function () {
          if (candidate.state === "installed" && navigator.serviceWorker.controller) offerUpdate(candidate);
        });
      });
      navigator.serviceWorker.addEventListener("controllerchange", function () { window.location.reload(); });
    }).catch(function (error) { console.warn("[STONE PWA] Service worker indisponible", error); });
  }

  /* ---- Démarrage (v9, décision Stan 02/09/2026) ------------------------------
     « Ta pyramide patrimoniale » est l'écran de lancement de STONE : elle
     s'affiche après la coque, à chaque ouverture, et c'est de là qu'on part vers
     Money, Invest ou Estate. Seule exception : le lien profond `?u=<key>`
     (recette, partage, raccourci) ouvre l'univers demandé sans passer par le
     hall. La reprise automatique du « dernier univers » (son ancienne clé
     localStorage et son écriture) est retirée : elle privait Stan de la pyramide
     dès la 2e ouverture. En session, l'univers actif reste porté par l'URL
     (history.replaceState) et les iframes restent vivants ; `showHome()` nettoie
     `?u=` pour que le retour par le logo pyramide STONE soit un vrai retour au hall. */
  function bootTarget(href) {
    try { return new URL(href).searchParams.get("u") || ""; } catch (e) { return ""; }
  }
  /* Purge unique de l'ancienne clé v8 : les coques déjà installées ne doivent
     pas garder de résidu orphelin sur l'appareil. */
  try { localStorage.removeItem("STONE_PWA_LAST_UNIVERSE::" + INSTANCE); } catch (e) {}
  document.getElementById("brandHomeButton").addEventListener("click", function () { showHome(); });
  document.getElementById("tourReplay").addEventListener("click", function () {
    closeSettings();
    showHome();
    setTimeout(function () { tourStart(); }, 420);
  });
  var requested = bootTarget(window.location.href);
  if (universe(requested)) activate(requested, false);
  else showHome();
})();
</script>
</body>
</html>
