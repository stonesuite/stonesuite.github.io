<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090c">
  <title>STONE — Hors connexion</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#08090c;color:#eef0f4;font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;text-align:center}
    .mark{color:#c9a567;font-size:42px}
    h1{margin:14px 0 0;font-size:22px;letter-spacing:-.02em}
    p{max-width:420px;margin:10px auto 0;color:#888d9a;font-size:13px;line-height:1.6}
    button{margin-top:20px;border:1px solid #c9a567;border-radius:10px;padding:10px 20px;background:#c9a567;color:#171109;font-size:13px;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">◈</div>
    <h1>Connexion indisponible</h1>
    <p>STONE nécessite une connexion pour afficher vos univers. Aucune donnée financière n’est conservée dans le cache de la coque.</p>
    <button type="button" onclick="window.location.replace('./')">Réessayer</button>
  </main>
</body>
</html>
