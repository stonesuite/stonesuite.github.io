name: Etat du service STONE
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      # Apps Script sert parfois une page d'attente Google (demarrage a froid) au lieu d'executer le script, sans
      # rapport avec un vrai arret du service : observe les 23, 25 et 28/09/2026, toujours resolu a l'essai suivant
      # quelques secondes plus tard. Jusqu'a 3 essais espaces de 20 s avant de declarer une vraie panne (29/09/2026),
      # pour ne plus alerter sur un demarrage a froid isole.
      - name: Moteur de marche (route publique LEDGE)
        run: |
          set -e
          ok=""
          for i in 1 2 3; do
            corps=$(curl -sSL --max-time 60 "https://script.google.com/macros/s/AKfycbxnezcY4X7YzwfLy9UcwrSB2-Va2al945lpRVlotqMqfz_64vL2crtqCkf3z4oJlx9M/exec?route=dividends")
            echo "essai $i/3 :"; echo "$corps" | head -c 200; echo
            if echo "$corps" | grep -q '"ok":true'; then ok=1; break; fi
            [ "$i" -lt 3 ] && sleep 20
          done
          [ -n "$ok" ] || { echo "LEDGE : reponse invalide apres 3 essais"; exit 1; }
      # Le domaine publie est celui du CNAME (stoneinvest.ci). stonesuite.github.io ne sert
      # plus les pages : il repond 301 vers le domaine. Le controle interrogeait l'ancien
      # hote et exigeait 200 sans suivre la redirection, donc il echouait a chaque passage
      # alors que le site etait en ligne (23/09/2026). On interroge le domaine reel, et -L
      # suit les redirections qui restent legitimes (http -> https, barre finale).
      - name: Coque STONE Invest (nouveau lien)
        run: |
          set -e
          for u in https://stoneinvest.ci/invest-next/ https://stoneinvest.ci/invest-next/config.js https://stoneinvest.ci/guides/statut.html https://stoneinvest.ci/.well-known/assetlinks.json; do
            ok=""
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "$u"); echo "$u -> $code (essai $i/3)"
              [ "$code" = "200" ] && { ok=1; break; }
              [ "$i" -lt 3 ] && sleep 20
            done
            [ -n "$ok" ] || exit 1
          done
      # Meme demarrage a froid possible que pour la route LEDGE : jusqu'a 3 essais (29/09/2026).
      - name: Application STONE Invest (page de connexion Google attendue, jamais une erreur)
        run: |
          set -e
          ok=""
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 60 "https://script.google.com/macros/s/AKfycbzDRyB_5J65k1xOF9M_OuCUBNoIhCyRsClauSxfoiZliD4LLjcXKJZj09Tzk5erdOBESA/exec?app=invest")
            echo "exec -> $code (essai $i/3)"
            [ "$code" = "200" ] && { ok=1; break; }
            [ "$i" -lt 3 ] && sleep 20
          done
          [ -n "$ok" ] || exit 1
